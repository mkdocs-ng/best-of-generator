name: build-pipeline

on:
  workflow_dispatch:
  push:
  pull_request:

# Runs the same checks as `build.py --make --check --test` directly on the
# runner. The old mltooling/build-environment container ships a Docker CLI that
# can no longer talk to the runner's Docker daemon, so it failed before running
# anything.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.8 with uv
        run: |
          pip install uv
          uv venv -p 3.8 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install
        # Same tool versions the build container used.
        run: uv pip install -e ".[dev]" "black==24.8.0" "isort==5.13.2" "flake8==7.1.2" "mypy==0.812" build

      - name: Build distribution
        # `python -m build` would import the local build.py instead
        run: pyproject-build

      - name: Code checks
        run: |
          black --check src tests
          isort --profile black --check-only src tests
          pydocstyle src
          mypy src
          flake8 --show-source --statistics src tests

      - name: Test
        run: pytest -m "not slow"
